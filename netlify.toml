[build]
  command = "npm run build"
  publish = "dist/checkmate/browser"

[build.environment]
  NODE_VERSION = "24"

# Angular handles routing in the browser, so every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Google sign-in uses a popup that must be able to report back to this window.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Build output file names are content-hashed, so they can be cached forever.
# Match them by prefix: a broad "/*.js" rule would also freeze ngsw-worker.js,
# and a frozen service worker never picks up new deploys.
[[headers]]
  for = "/main-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunk-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The chess engine's file names carry its version, so a new engine gets new names.
[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker checks these on every launch to find new deploys.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
